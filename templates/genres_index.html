<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse by Genre | CineMatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% include '_nav.html' %}

  <div class="container container-results">
    <h2 class="section-title" style="margin-left:0;">Browse by Genre</h2>
    <p style="color:var(--muted); max-width:700px; margin-bottom:30px;">{{ genre_counts|length }} genres across the catalogue.</p>

    <div class="genre-grid">
      {% for genre, count in genre_counts %}
        <a href="{{ url_for('genre_browse', genre=genre) }}" class="genre-card">
          <div class="genre-card-name">{{ genre }}</div>
          <div class="genre-card-count">{{ count }} movies</div>
        </a>
      {% endfor %}
    </div>
  </div>

  <footer>Movie Recommendation System &middot; MCA Minor Project &middot; Content-Based Filtering (TF-IDF &amp; Cosine Similarity)</footer>
</body>
</html>
